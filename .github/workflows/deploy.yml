name: Deploy to Cloudflare Pages

# ⏸️2026-08-19 自動実行を停止（手動実行のみ）。
# 本番配信は「Deploy to Xserver」(deploy-xserver.yml)で、hayazai.com はそちらに反映される。
# こちらは CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のため push のたびに必ず失敗し、
# Actions が常に赤くなって本当の失敗に気づけなくなっていたため push トリガーを外した。
# Cloudflare Pages を使う場合は上記2つのSecretsを登録してから push: branches:[main] を戻すこと。
# （ギャラリーJSONの生成は Xserver 側ワークフローでも実行しているのでこの停止による欠落はない）
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build gallery JSON
        run: node scripts/build-gallery.js

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: hayazai-website
          directory: .
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
